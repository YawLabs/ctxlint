name: 'ctxlint'
description: 'Lint AI agent context files and MCP server configs against your actual codebase'
branding:
  icon: 'check-circle'
  color: 'blue'

inputs:
  args:
    description: 'CLI arguments to pass to ctxlint (default: --strict)'
    required: false
    default: '--strict'
  version:
    description: 'ctxlint version to use (default: latest)'
    required: false
    default: 'latest'

runs:
  using: 'composite'
  steps:
    # Node: the job's own, when it already has one that ctxlint supports
    # (engines: node >=20) -- a composite action's setup-node changes the Node
    # every LATER step of the consumer's job runs on, so it is only installed
    # when the job has none, or one older than 20. Then it is the current LTS
    # ('lts/*'), never a pinned major that reaches end of life under the
    # consumer. The check runs only node itself, so no input reaches a shell.
    - name: Check for a usable Node.js
      id: node
      shell: bash
      run: |
        if command -v node >/dev/null 2>&1 &&
          [ "$(node -p 'Number(process.versions.node.split(".")[0])' 2>/dev/null || echo 0)" -ge 20 ]; then
          echo "usable=true" >> "$GITHUB_OUTPUT"
        else
          echo "usable=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Set up Node.js (only when the job has no usable one)
      if: steps.node.outputs.usable != 'true'
      uses: actions/setup-node@v6
      with:
        node-version: 'lts/*'

    - name: Run ctxlint
      shell: bash
      # Inputs flow through env vars, never interpolated inline into the
      # script body: expression interpolation pastes the raw input into the
      # shell script before it runs, so a consumer workflow that wires
      # attacker-influenceable data (issue title, branch name) into `with:`
      # would hand that data command execution on their runner.
      # CTXLINT_ARGS is expanded unquoted on purpose -- it carries multiple
      # whitespace-separated CLI flags that must word-split.
      env:
        CTXLINT_VERSION: ${{ inputs.version }}
        CTXLINT_ARGS: ${{ inputs.args }}
      run: npx -y "@yawlabs/ctxlint@${CTXLINT_VERSION}" ${CTXLINT_ARGS}
