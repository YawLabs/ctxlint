- id: ctxlint
  name: ctxlint
  description: Lint AI agent context files against your actual codebase
  # Version-pinned so a checkout at `rev: vX.Y.Z` runs exactly that release
  # of ctxlint — matches the pinning done by `ctxlint init`. release.sh keeps
  # this in sync with package.json on each bump. `--yes` so npx never stops
  # to ask before installing the package: under pre-commit there is no one to
  # answer, and an unanswered prompt reads as a hung commit.
  entry: npx --yes @yawlabs/ctxlint@0.29.0 --strict
  # `system`, not `node`: pre-commit builds a `language: node` hook by running
  # `npm install .` on THIS repo, which carries no dist/ in git -- an install
  # that cannot run ctxlint and exists only so the entry above can fetch the
  # published, pinned package from the registry anyway. `system` installs
  # nothing and needs Node (npx) on the machine, as the entry always did.
  # pre-commit 4.4 renamed `system` to `unsupported`; `system` is kept because
  # it still works there and every older pre-commit rejects `unsupported`.
  language: system
  always_run: true
  pass_filenames: false
